services:
  - type: web
    name: labuibu-api
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm --filter @labuibu/api... install --frozen-lockfile
    startCommand: pnpm --filter @labuibu/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
